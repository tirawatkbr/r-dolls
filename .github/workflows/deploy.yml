name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# ถ้ามีการ push ซ้อนกัน ให้ตัวใหม่ชนะ ไม่ต้องรอคิว
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # เว็บเป็นไฟล์นิ่งล้วน ไม่ต้อง build อะไร เอาทั้งโฟลเดอร์ public ขึ้นเลย
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
